<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040a11">
<style>:root{color-scheme:dark}[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>JARVIS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Düzen: üstte başlık, ortada sekme içeriği (ana sayfada büyük daire), altta üç sekmeli gezinme çubuğu. */
:root {
  color-scheme: dark;
  --bg: #040a11;
  --panel: #0a1520;
  --panel-2: #0e1d2b;
  --line: #173a52;
  --fg: #d9eef7;
  --dim: #7ea2b4;
  --cyan: #4fd6ff;
  --cyan-deep: #0c4a63;
  --amber: #ffb040;
  --red: #ff5a6a;
  --ok: #4fe3a8;
  --f-display: 'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    linear-gradient(rgba(79,214,255,.035) 1px, transparent 1px) 0 0 / 100% 32px,
    linear-gradient(90deg, rgba(79,214,255,.035) 1px, transparent 1px) 0 0 / 32px 100%,
    var(--bg);
  color: var(--fg);
  font: 500 17px/1.35 var(--f-display);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

.app { height: 100%; max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }

/* header */
.top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; flex-shrink: 0; }
.brand { min-width: 0; text-align: center; grid-column: 2; }
.brand h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .28em; padding-left: .28em; color: var(--cyan); line-height: 1; }
.brand p { margin: 4px 0 0; font: 400 10px/1.2 var(--f-mono); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
.top-right { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 34px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; color: var(--dim); }
.icon-btn[aria-pressed="true"] { color: var(--cyan); border-color: var(--cyan-deep); }
.icon-btn svg { width: 16px; height: 16px; }

.panels { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.panel { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-block: 4px; }

/* home */
.home { align-items: center; justify-content: center; gap: 14px; text-align: center; }
.orb { --rs: min(78vw, 44vh, 340px); width: var(--rs); height: var(--rs); padding: 0; border: 0; border-radius: 50%; background: none; display: block; flex-shrink: 0; -webkit-tap-highlight-color: transparent; }
.orb canvas { width: 100%; height: 100%; display: block; }
.orb:focus-visible { outline-offset: 6px; }
.hint { font: 500 12px/1.4 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); min-height: 1.4em; max-width: 34ch; }
.hint.err { color: var(--red); letter-spacing: .02em; text-transform: none; font-size: 13px; }
.caption { max-width: 36ch; font-size: 19px; line-height: 1.32; overflow-wrap: anywhere; }
.caption:empty { display: none; }
.actions { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.actions:empty { display: none; }
.linkrow { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
.openbtn { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; background: var(--cyan); color: #031017; border-radius: 4px; font: 600 15px/1 var(--f-display); letter-spacing: .04em; text-decoration: none; }
.host { font: 400 11px/1 var(--f-mono); color: var(--dim); overflow-wrap: anywhere; }
button.openbtn { border: 0; cursor: pointer; }
.picked { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.picked img { display: block; max-width: min(100%, 220px); max-height: 200px; border: 1px solid var(--line); border-radius: 4px; }

/* history */
.sec { margin: 18px 0 8px; font: 500 11px/1 var(--f-mono); letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
.sec.first { margin-top: 4px; }
.log { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 94%; min-width: 0; }
.msg .who { display: flex; gap: 8px; align-items: baseline; font: 500 10px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; margin-bottom: 5px; color: var(--cyan); }
.msg .when { color: var(--dim); letter-spacing: .06em; }
.msg .body { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 18px; line-height: 1.32; }
.msg.user { align-self: flex-end; }
.msg.user .who { color: var(--dim); justify-content: flex-end; }
.msg.user .body { background: var(--panel-2); border: 1px solid var(--line); padding: 8px 12px; border-radius: 4px; }
.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.fact { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.fact span { overflow-wrap: anywhere; min-width: 0; }
.fact button { background: none; border: 0; color: var(--dim); font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px; flex-shrink: 0; }
.fact button:hover { color: var(--red); }
.empty { color: var(--dim); padding: 6px 0; }
.stat { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 18px; font: 400 12px/1.3 var(--f-mono); color: var(--dim); }
.stat button { padding: 7px 11px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.stat button:hover { border-color: var(--red); }

/* more */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding-bottom: 6px; }
.c { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 12px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.c.w { grid-column: 1 / -1; }
.c h2 { margin: 0; font: 500 10px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.clock { font: 600 52px/1 var(--f-display); letter-spacing: .04em; font-variant-numeric: tabular-nums; color: var(--cyan); }
.big { font: 600 38px/1 var(--f-display); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.mid { font-size: 22px; font-weight: 600; line-height: 1.15; }
.sub { font: 400 12px/1.45 var(--f-mono); color: var(--dim); overflow-wrap: anywhere; }
.sub.warn { color: var(--amber); }
.track { height: 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--cyan); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.sbtn { display: inline-flex; align-items: center; padding: 8px 11px; border: 1px solid var(--line); background: var(--panel-2); border-radius: 4px; font: 500 11px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--fg); text-decoration: none; }
.sbtn:hover { border-color: var(--cyan-deep); }
.sbtn.on { background: var(--cyan); border-color: var(--cyan); color: #031017; }
.rows { display: flex; flex-direction: column; gap: 6px; margin: 0; }
.row { display: flex; justify-content: space-between; gap: 12px; font-size: 16px; border-bottom: 1px dashed var(--line); padding-bottom: 5px; }
.row span:last-child { font-family: var(--f-mono); font-size: 13px; color: var(--cyan); text-align: right; font-variant-numeric: tabular-nums; }

/* nav */
.nav { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); flex-shrink: 0; padding-top: 4px; }
.nb { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; color: var(--dim); font: 500 11px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.nb svg { width: 22px; height: 22px; }
.nb[aria-current="page"] { color: var(--cyan); }
</style>
</head>
<body>
<script src="shim.js"></script>


<div class="app">
  <header class="top">
    <div class="brand">
      <h1>J.A.R.V.I.S.</h1>
      <p>Just A Rather Very Intelligent System</p>
    </div>
    <div class="top-right">
      <button class="icon-btn" id="sound" type="button" aria-pressed="true" aria-label="Sesli yanıt">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
    </div>
  </header>

  <div class="panels">
    <section class="panel home" id="panel-home">
      <button class="orb" id="orb" type="button" aria-label="Dinlemeyi aç veya kapat"><canvas id="reactor" aria-hidden="true"></canvas></button>
      <div class="hint" id="hint" aria-live="polite"></div>
      <div class="caption" id="caption" aria-live="polite"></div>
      <div class="actions" id="actions"></div>
    </section>

    <section class="panel" id="panel-hist" hidden>
      <div class="scroll" id="hist-scroll">
        <h2 class="sec first">Konuşma geçmişi</h2>
        <div class="log" id="hist"></div>
        <h2 class="sec">Öğrendiklerim</h2>
        <ul class="facts" id="facts"></ul>
        <div class="stat"><span id="hist-stat"></span><button type="button" id="clear-hist">Geçmişi temizle</button></div>
      </div>
    </section>

    <section class="panel" id="panel-more" hidden>
      <div class="scroll">
        <div class="cards">
          <div class="c w"><h2>Saat</h2><div class="clock" id="m-clock">--:--:--</div><div class="sub" id="m-tz"></div></div>
          <div class="c w"><h2>Tarih</h2><div class="mid" id="m-day"></div><div class="sub" id="m-date"></div><div class="sub" id="m-week"></div></div>
          <div class="c w"><h2>Yıl ilerlemesi</h2><div class="mid" id="m-year"></div><div class="track"><i id="m-year-bar" style="width:0%"></i></div><div class="sub" id="m-year-sub"></div></div>
          <div class="c w"><h2>Zamanlayıcı</h2><div class="big" id="m-timer">05:00</div><div class="btns" id="m-presets"></div><div class="btns"><button class="sbtn on" type="button" id="m-tstart">Başlat</button><button class="sbtn" type="button" id="m-treset">Sıfırla</button></div></div>
          <div class="c"><h2>Pil</h2><div class="mid" id="m-bat">--</div><div class="sub" id="m-bat-sub"></div></div>
          <div class="c"><h2>Bağlantı</h2><div class="mid" id="m-net">--</div><div class="sub" id="m-net-sub"></div></div>
          <div class="c w"><h2>Dünya saatleri</h2><div class="rows" id="m-world"></div></div>
          <div class="c w"><h2>Cihaz</h2><div class="rows" id="m-dev"></div></div>
        </div>
      </div>
    </section>
  </div>

  <nav class="nav" aria-label="Bölümler">
    <button class="nb" type="button" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>
      Ana sayfa
    </button>
    <button class="nb" type="button" data-tab="hist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
      Geçmiş
    </button>
    <button class="nb" type="button" data-tab="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
      Diğer
    </button>
  </nav>
</div>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var KEY = 'jarvis-v1', TAU = Math.PI * 2;
  var S = { mode: 'idle', sound: true, history: [], memory: [] };
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var dd = JSON.parse(raw);
      if (Array.isArray(dd.history)) S.history = dd.history;
      if (Array.isArray(dd.memory)) S.memory = dd.memory;
      if (typeof dd.sound === 'boolean') S.sound = dd.sound;
    }
  } catch (e) {}
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ history: S.history, memory: S.memory, sound: S.sound })); } catch (e) {}
  }

  /* ---------- home: status, notes, links ---------- */
  var hint = $('#hint'), caption = $('#caption'), actions = $('#actions');
  var micState = 'unknown', NOTE = '', NOTE_ERR = false, noteT = 0;
  var auto = true, needsTap = false, emptyRuns = 0, talking = false;
  var HINT = { listening: 'Dinliyorum · konuşabilirsiniz', thinking: 'Düşünüyorum', speaking: 'Konuşuyor · durdurmak için dokunun' };
  function updateHint() {
    var t = NOTE;
    if (!t) {
      if (S.mode === 'idle') {
        if (micState === 'none') t = 'Mikrofon bu görüntüleyicide kullanılamıyor';
        else if (needsTap) t = 'Dinlemeyi başlatmak için bir kez dokunun';
        else if (!auto) t = 'Dinleme kapalı · dokunun';
        else t = 'Hazır';
      } else t = HINT[S.mode];
    }
    hint.textContent = t; hint.classList.toggle('err', !!NOTE && NOTE_ERR);
  }
  function note(text, err, ms) {
    NOTE = text; NOTE_ERR = !!err; clearTimeout(noteT);
    noteT = setTimeout(function () { NOTE = ''; updateHint(); }, ms || 4000);
    updateHint();
  }
  function setMode(m) {
    S.mode = m;
    updateHint();
  }
  function addLink(label, url) {
    var row = document.createElement('div'); row.className = 'linkrow';
    var a = document.createElement('a'); a.className = 'openbtn';
    a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = 'Aç · ' + label;
    var h = document.createElement('span'); h.className = 'host';
    try { h.textContent = new URL(url).hostname; } catch (e) {}
    row.appendChild(a); row.appendChild(h); actions.appendChild(row);
  }

  var PICK = {
    camera: { label: 'Kamera', accept: 'image/*', capture: 'environment' },
    gallery: { label: 'Galeri', accept: 'image/*,video/*' },
    files: { label: 'Dosyalar', accept: '' }
  };
  var pickedUrl = '';
  function showPicked(f) {
    var old = actions.querySelector('.picked'); if (old) old.remove();
    if (pickedUrl) { try { URL.revokeObjectURL(pickedUrl); } catch (e) {} pickedUrl = ''; }
    var box = document.createElement('div'); box.className = 'picked';
    if (f.type && f.type.indexOf('image/') === 0) {
      try { pickedUrl = URL.createObjectURL(f); var im = document.createElement('img'); im.src = pickedUrl; im.alt = f.name; box.appendChild(im); } catch (e) {}
    }
    var cap = document.createElement('span'); cap.className = 'host';
    cap.textContent = f.name + ' · ' + (f.size >= 1048576 ? (f.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1024)) + ' KB');
    box.appendChild(cap); actions.appendChild(box);
  }
  function addPicker(kind) {
    var k = PICK[kind]; if (!k) throw new Error('Bilinmeyen seçici');
    var row = document.createElement('div'); row.className = 'linkrow';
    var inp = document.createElement('input'); inp.type = 'file'; inp.hidden = true;
    if (k.accept) inp.accept = k.accept;
    if (k.capture) inp.setAttribute('capture', k.capture);
    inp.addEventListener('change', function () { var f = inp.files && inp.files[0]; if (f) showPicked(f); });
    var b = document.createElement('button'); b.type = 'button'; b.className = 'openbtn'; b.textContent = 'Aç · ' + k.label;
    b.addEventListener('click', function () { inp.click(); });
    var h = document.createElement('span'); h.className = 'host'; h.textContent = 'sistem seçicisi';
    row.appendChild(inp); row.appendChild(b); row.appendChild(h); actions.appendChild(row);
  }

  /* ---------- history ---------- */
  function fmtWhen(t) {
    if (!t) return '';
    var d = new Date(t), n = new Date();
    var time = d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === n.toDateString()) return time;
    return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short' }) + ' ' + time;
  }
  function renderHistory() {
    var host = $('#hist'); host.textContent = '';
    if (!S.history.length) {
      var e = document.createElement('div'); e.className = 'empty';
      e.textContent = 'Henüz konuşma yok. Ana sayfada daireye dokunup konuşun.';
      host.appendChild(e);
    }
    S.history.forEach(function (m) {
      var el = document.createElement('div'); el.className = 'msg ' + (m.role === 'user' ? 'user' : 'jarvis');
      var who = document.createElement('div'); who.className = 'who';
      var n = document.createElement('span'); n.textContent = m.role === 'user' ? 'Siz' : 'JARVIS';
      var w = document.createElement('span'); w.className = 'when'; w.textContent = fmtWhen(m.t);
      who.appendChild(n); who.appendChild(w);
      var body = document.createElement('div'); body.className = 'body'; body.textContent = m.content;
      el.appendChild(who); el.appendChild(body); host.appendChild(el);
    });
    $('#hist-stat').textContent = S.history.length + ' mesaj';
  }
  function renderFacts() {
    var ul = $('#facts'); ul.textContent = '';
    if (!S.memory.length) {
      var li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'Henüz bir şey öğrenmedim. "Kahvemi sade içerim, bunu hatırla" gibi bir şey söyleyin.';
      ul.appendChild(li);
    }
    S.memory.forEach(function (f, i) {
      var li = document.createElement('li'); li.className = 'fact';
      var s = document.createElement('span'); s.textContent = f;
      var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Unut';
      b.setAttribute('aria-label', 'Unut: ' + f);
      b.addEventListener('click', function () { S.memory.splice(i, 1); save(); renderFacts(); });
      li.appendChild(s); li.appendChild(b); ul.appendChild(li);
    });
  }

  /* ---------- tools ---------- */
  var ALLOWED = /^(sqrt|sin|cos|tan|log|ln|abs|exp|pow|min|max|round|floor|ceil|pi)$/;
  function calc(expr) {
    var e = String(expr).toLowerCase().replace(/\^/g, '**').replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/');
    var words = e.match(/[a-z]+/g) || [];
    for (var i = 0; i < words.length; i++) if (!ALLOWED.test(words[i])) throw new Error('Desteklenmeyen ifade');
    var stripped = e.replace(/[a-z]+/g, '');
    if (!/^[\d+\-*/().\s%]*$/.test(stripped)) throw new Error('Desteklenmeyen karakter');
    var code = e.replace(/\bpi\b/g, 'Math.PI').replace(/\bln\b/g, 'Math.log').replace(/\blog\b/g, 'Math.log10')
      .replace(/\b(sqrt|sin|cos|tan|abs|exp|pow|min|max|round|floor|ceil)\b/g, 'Math.$1');
    var v = Function('"use strict";return (' + code + ')')();
    if (typeof v !== 'number' || !isFinite(v)) throw new Error('Sonuç hesaplanamadı');
    return v;
  }
  var BAT = null;
  try { if (navigator.getBattery) navigator.getBattery().then(function (b) { BAT = b; }).catch(function () {}); } catch (e) {}
  function tzName() { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { return ''; } }
  function ctxInfo() {
    var tz = tzName();
    var o = {
      now: new Date().toLocaleString('tr-TR', { dateStyle: 'full', timeStyle: 'short' }),
      timezone: tz,
      region_hint_from_timezone: tz.split('/').slice(-1)[0].replace(/_/g, ' '),
      language: navigator.language || '',
      online: navigator.onLine,
      screen: window.screen ? screen.width + 'x' + screen.height : ''
    };
    if (BAT) o.battery = Math.round(BAT.level * 100) + '%' + (BAT.charging ? ' (şarjda)' : '');
    return o;
  }
  var IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var APPS = {
    youtube: { label: 'YouTube', home: 'https://www.youtube.com/', search: 'https://www.youtube.com/results?search_query=' },
    maps: { label: 'Google Haritalar', home: 'https://www.google.com/maps', search: 'https://www.google.com/maps/search/?api=1&query=' },
    google: { label: 'Google', home: 'https://www.google.com/', search: 'https://www.google.com/search?q=' },
    gmail: { label: 'Gmail', home: 'https://mail.google.com/' },
    whatsapp: { label: 'WhatsApp', home: 'https://wa.me/', search: 'https://wa.me/?text=' },
    spotify: { label: 'Spotify', home: 'https://open.spotify.com/', search: 'https://open.spotify.com/search/' },
    instagram: { label: 'Instagram', home: 'https://www.instagram.com/' },
    x: { label: 'X', home: 'https://x.com/' },
    netflix: { label: 'Netflix', home: 'https://www.netflix.com/' },
    calendar: { label: 'Google Takvim', home: 'https://calendar.google.com/' },
